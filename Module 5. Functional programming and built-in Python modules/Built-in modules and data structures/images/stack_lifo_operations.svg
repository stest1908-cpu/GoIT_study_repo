<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <!-- Column 1: empty stack -->
  <g>
    <path d="M40,140 L40,330 L180,330 L180,140" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
    <text x="110" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">empty</text>
    <text x="110" y="425" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">stack</text>
  </g>

  <!-- Arrow into column 2 -->
  <path d="M195,95 Q230,95 245,140" fill="none" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 2: push 1 -->
  <g>
    <path d="M215,140 L215,330 L355,330 L355,140" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
    <rect x="235" y="155" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="285" y="191" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <text x="285" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">push</text>
  </g>

  <!-- Arrow into column 3 -->
  <path d="M370,95 Q405,95 420,140" fill="none" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 3: push 2 -->
  <g>
    <path d="M390,140 L390,330 L530,330 L530,140" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
    <rect x="410" y="275" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="460" y="311" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <rect x="410" y="215" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="460" y="251" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <text x="460" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">push</text>
  </g>

  <!-- Arrow into column 4 -->
  <path d="M545,95 Q580,95 595,140" fill="none" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 4: push 3 -->
  <g>
    <path d="M565,140 L565,330 L705,330 L705,140" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
    <rect x="585" y="275" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="635" y="311" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <rect x="585" y="215" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="635" y="251" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <rect x="585" y="155" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="635" y="191" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="635" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">push</text>
  </g>

  <!-- Arrow out of column 5 (pop) -->
  <path d="M760,120 Q800,60 850,40" fill="none" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Column 5: pop -->
  <g>
    <path d="M740,140 L740,330 L880,330 L880,140" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linejoin="round"/>
    <rect x="760" y="275" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="810" y="311" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
    <rect x="760" y="215" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="810" y="251" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2</text>
    <rect x="760" y="140" width="100" height="55" rx="10" fill="#60a5fa"/>
    <text x="810" y="176" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3</text>
    <text x="810" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">pop</text>
  </g>
</svg>
